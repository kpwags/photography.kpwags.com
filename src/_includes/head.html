<script>
	function isDarkMode() {
		const prefferredMode = window.matchMedia('(prefers-color-scheme: dark)');

		if (prefferredMode.matches) {
			return true;
		}

		return false;
	}

	function setTheme() {
		let isSystem = false;
		let theme = window.localStorage.getItem('data-theme');

		if (!theme) {
			theme = isDarkMode() ? 'dark' : 'light';
		}

		document.documentElement.setAttribute('data-theme', theme);
		document.getElementById('toggle-theme-button').setAttribute('data-current-mode', theme);
	}

	function toggleTheme() {
		const currentTheme = document.documentElement.getAttribute('data-theme');
		let newTheme = 'light';

		if (currentTheme === "light") {
			newTheme = 'dark';
		}
		
		window.localStorage.setItem('data-theme', newTheme);
		document.documentElement.setAttribute('data-theme', newTheme);
		document.getElementById('toggle-theme-button').setAttribute('data-current-mode', newTheme);
	}

	addEventListener('DOMContentLoaded', (event) => {
		setTheme();

		document.getElementById('toggle-theme-button').addEventListener('click', function () {
			toggleTheme();
		});
	});
</script>
